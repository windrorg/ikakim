name: ikakim Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux:
    name: Release Linux Binaries (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libfdk-aac-dev libegl-dev libgl-dev \
            libgbm-dev libdrm-dev libvulkan1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release -p platform-linux-vm -p platform-linux-arm64 -p ffi-capi
      - name: Package Linux archive
        run: |
          mkdir -p dist/ikakim-linux-x86_64
          cp target/release/platform-linux-vm target/release/platform-linux-arm64 \
            target/release/libffi_capi.so crates/ffi-capi/include/ikakim_ffi.h \
            dist/ikakim-linux-x86_64/
          tar -C dist -czf dist/ikakim-linux-x86_64.tar.gz ikakim-linux-x86_64
          sha256sum dist/ikakim-linux-x86_64.tar.gz > dist/ikakim-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ikakim-linux-x86_64-release
          path: |
            dist/ikakim-linux-x86_64.tar.gz
            dist/ikakim-linux-x86_64.tar.gz.sha256

  release-apple:
    name: Release macOS Binary & iOS XCFramework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS release host & iOS Release XCFramework
        run: |
          cargo build --release -p platform-macos
          ./scripts/build-ios-xcframework.sh --release
      - name: Package Apple archives
        run: |
          mkdir -p dist/ikakim-macos-arm64
          cp target/release/platform-macos crates/ffi-capi/include/ikakim_ffi.h dist/ikakim-macos-arm64/
          tar -C dist -czf dist/ikakim-macos-arm64.tar.gz ikakim-macos-arm64
          ditto -c -k --sequesterRsrc --keepParent build/ios/IkakimFFI.xcframework dist/IkakimFFI.xcframework.zip
          (cd dist && shasum -a 256 ikakim-macos-arm64.tar.gz IkakimFFI.xcframework.zip > ikakim-apple-checksums.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: ikakim-apple-release
          path: |
            dist/ikakim-macos-arm64.tar.gz
            dist/IkakimFFI.xcframework.zip
            dist/ikakim-apple-checksums.sha256

  release-android:
    name: Release Android NDK JNI & APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Build release libffi_capi.so (arm64-v8a)
        run: ./scripts/build-android-jni.sh --release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Assemble Android APK
        working-directory: platforms/android
        run: gradle assembleDebug --no-daemon
      - name: Package Android archive
        run: |
          mkdir -p dist/ikakim-android-arm64
          cp platforms/android/app/src/main/jniLibs/arm64-v8a/libffi_capi.so dist/ikakim-android-arm64/
          cp platforms/android/app/build/outputs/apk/debug/*.apk dist/ikakim-android-arm64/
          cp crates/ffi-capi/include/ikakim_ffi.h dist/ikakim-android-arm64/
          tar -C dist -czf dist/ikakim-android-arm64.tar.gz ikakim-android-arm64
          sha256sum dist/ikakim-android-arm64.tar.gz > dist/ikakim-android-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ikakim-android-arm64-release
          path: |
            dist/ikakim-android-arm64.tar.gz
            dist/ikakim-android-arm64.tar.gz.sha256

  publish-github-release:
    name: Publish GitHub Release (tags v*)
    needs: [release-linux, release-apple, release-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --title "$TAG" --generate-notes
          fi
