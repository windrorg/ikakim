name: ikakim CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (x86_64) Test & Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libfdk-aac-dev libegl-dev libgl-dev \
            libgbm-dev libdrm-dev libvulkan1 mesa-vulkan-drivers clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify C99 FFI header
        run: clang -fsyntax-only -Wall -Wextra -std=c99 crates/ffi-capi/include/ikakim_ffi.h
      - name: Run workspace tests (excluding Lima vivid kernel-module tests)
        run: |
          cargo test --workspace --exclude linux-common
          cargo test -p linux-common --test linux_audio_test
          cargo test -p linux-common --test linux_m3_hw_test
          cargo test -p linux-common --test linux_video_test test_image_decode_png_and_ppm_and_swh264_roundtrip
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Linux binary soak smoke test
        run: cargo run -p platform-linux-arm64 -- --soak --frames 15 --width 320 --height 180 --fps 30 127.0.0.1:0

  macos-and-ios:
    name: macOS & iOS Build, Test, Clippy, Swift Typecheck
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify C99 FFI header
        run: clang -fsyntax-only -Wall -Wextra -std=c99 crates/ffi-capi/include/ikakim_ffi.h
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run macOS binary smoke test
        run: cargo run -p platform-macos -- --frames 10 127.0.0.1:0
      - name: Build IkakimFFI.xcframework and link iOS Simulator binary
        run: |
          ./scripts/build-ios-xcframework.sh --debug
          xcrun --sdk iphonesimulator swiftc -target arm64-apple-ios16.0-simulator \
            -I build/ios/IkakimFFI.xcframework/ios-arm64-simulator/Headers \
            -L build/ios/IkakimFFI.xcframework/ios-arm64-simulator -lffi_capi \
            -framework AVFoundation -framework CoreMedia -framework CoreVideo \
            -framework Metal -framework VideoToolbox -framework AudioToolbox \
            -framework CoreAudio -framework ImageIO -framework WebKit \
            -framework CoreFoundation -framework QuartzCore -framework Security \
            -parse-as-library platforms/ios/*.swift -o /tmp/IkakimIosSimTest
          rm -f /tmp/IkakimIosSimTest
      - uses: actions/upload-artifact@v4
        with:
          name: ikakim-ios-xcframework
          path: build/ios/IkakimFFI.xcframework

  android:
    name: Android NDK (arm64-v8a) & Kotlin APK Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Build libffi_capi.so for arm64-v8a via Android NDK
        run: ./scripts/build-android-jni.sh --release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Assemble Android debug APK
        working-directory: platforms/android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ikakim-android-debug-apk
          path: |
            platforms/android/app/build/outputs/apk/debug/*.apk
            platforms/android/app/src/main/jniLibs/arm64-v8a/libffi_capi.so
