name: ikakim CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (x86_64) Test & Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libfdk-aac-dev libegl-dev libgl-dev \
            libgbm-dev libdrm-dev libvulkan1 mesa-vulkan-drivers clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify C99 FFI header
        run: clang -fsyntax-only -Wall -Wextra -std=c99 crates/ffi-capi/include/ikakim_ffi.h
      - name: Run workspace tests (excluding Lima vivid kernel-module tests)
        run: |
          cargo test --workspace --exclude linux-common
          cargo test -p linux-common --test linux_audio_test
          cargo test -p linux-common --test linux_m3_hw_test
          cargo test -p linux-common --test linux_video_test test_image_decode_png_and_ppm_and_swh264_roundtrip
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  macos-and-ios:
    name: macOS & iOS Build, Test, Clippy, Swift Typecheck
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify C99 FFI header
        run: clang -fsyntax-only -Wall -Wextra -std=c99 crates/ffi-capi/include/ikakim_ffi.h
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cross-build ffi-capi for iOS device & simulator
        run: |
          cargo build -p ffi-capi --target aarch64-apple-ios
          cargo build -p ffi-capi --target aarch64-apple-ios-sim
      - name: Typecheck iOS Swift host against Xcode iOS SDKs
        run: |
          xcrun --sdk iphoneos swiftc -typecheck -target arm64-apple-ios16.0 -I platforms/ios platforms/ios/*.swift
          xcrun --sdk iphonesimulator swiftc -typecheck -target arm64-apple-ios16.0-simulator -I platforms/ios platforms/ios/*.swift
