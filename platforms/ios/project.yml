name: IkakimIosHost
options:
  bundleIdPrefix: com.ikakim.live
  deploymentTarget:
    iOS: "16.0"
targets:
  IkakimIosHost:
    type: application
    platform: iOS
    sources:
      - path: AVCaptureCameraBridge.swift
      - path: VirtualCaptureSource.swift
      - path: IkakimEngine.swift
      - path: IkakimWebViewApp.swift
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ikakim.live.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
    dependencies:
      - framework: ../../build/ios/IkakimFFI.xcframework
        embed: false
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: Metal.framework
      - sdk: VideoToolbox.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: ImageIO.framework
      - sdk: WebKit.framework
